name = "gw2-leaderboard"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false

# Your own domain (Workers > Custom Domains). The hostname must not have another DNS record: delete the old one first.
routes = [{ pattern = "gw2.rauwman.org", custom_domain = true }]

[[d1_databases]]
binding = "DB"
database_name = "gw2-leaderboard"
database_id = "b9432df0-8ecb-4efc-99be-6271d0ec637a"

# Daily housekeeping: old rate-limit rows and stale friend requests.
[triggers]
crons = ["17 3 * * *"]

# Optional settings (defaults in src/config.js):
# [vars]
# REGISTRATION = "open"   # "closed" stops new sign-ups
# PUBLIC_BOARD = "1"      # "0" turns the read-only web page at / off
#
# Secret, set with `npx wrangler secret put ADMIN_TOKEN`: enables the /admin API. Without it the API answers 404.
